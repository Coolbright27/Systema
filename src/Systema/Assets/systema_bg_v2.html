
<style>
  .bg-wrap { width: 100%; aspect-ratio: 16/9; position: relative; overflow: hidden; border-radius: 12px; background: #0c0e14; }
  .bg-wrap canvas { display: block; width: 100%; height: 100%; }
</style>
<div class="bg-wrap">
  <canvas id="c"></canvas>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const wrap = canvas.parentElement;

function resize() {
  canvas.width = wrap.offsetWidth * window.devicePixelRatio;
  canvas.height = wrap.offsetHeight * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  draw();
}

function draw() {
  const W = wrap.offsetWidth;
  const H = wrap.offsetHeight;
  ctx.clearRect(0, 0, W, H);

  const bg = ctx.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0,   '#0a0c13');
  bg.addColorStop(0.5, '#0d0f18');
  bg.addColorStop(1,   '#090b11');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  function radialGlow(x, y, r, color, alpha) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color.replace(')', `,${alpha})`).replace('rgb', 'rgba'));
    g.addColorStop(1, color.replace(')', ',0)').replace('rgb', 'rgba'));
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(x, y, r * 1.4, r, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  radialGlow(W * 0.18, H * 0.28, H * 0.65, 'rgb(59,91,219)', 0.22);
  radialGlow(W * 0.78, H * 0.72, H * 0.55, 'rgb(109,40,217)', 0.18);
  radialGlow(W * 0.52, H * 0.1,  H * 0.40, 'rgb(37,99,235)',  0.12);
  radialGlow(W * 0.88, H * 0.2,  H * 0.35, 'rgb(124,58,237)', 0.10);

  ctx.save();
  ctx.globalAlpha = 0.028;
  ctx.strokeStyle = '#7ba7ff';
  ctx.lineWidth = 1;
  const gridX = Math.ceil(W / 80);
  const gridY = Math.ceil(H / 80);
  for (let i = 0; i <= gridX; i++) {
    const x = i * 80;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let j = 0; j <= gridY; j++) {
    const y = j * 80;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();

  function ring(x, y, r, color, alpha, lw) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = lw;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  ring(W * 0.82, H * 0.14, H * 0.28, '#4f7ef7', 0.18, 1);
  ring(W * 0.82, H * 0.14, H * 0.20, '#4f7ef7', 0.10, 0.5);
  ring(W * 0.82, H * 0.14, H * 0.12, '#7c5cf7', 0.12, 0.5);
  ring(W * 0.12, H * 0.82, H * 0.22, '#7c3aed', 0.14, 1);
  ring(W * 0.12, H * 0.82, H * 0.14, '#7c3aed', 0.08, 0.5);
  ring(W * 0.5,  H * 0.88, H * 0.10, '#3b82f6', 0.10, 0.5);

  function accentLine(x1, y1, x2, y2, color, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();
  }

  accentLine(0, H * 0.52, W * 0.52, 0,       '#4f7ef7', 0.07);
  accentLine(0, H * 0.72, W * 0.72, 0,       '#4f7ef7', 0.04);
  accentLine(W * 0.6, H,  W,        H * 0.4, '#7c3aed', 0.07);
  accentLine(W * 0.4, H,  W,        H * 0.2, '#7c3aed', 0.04);

  function dot(x, y, r, color, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  const dots = [
    [0.40, 0.20], [0.43, 0.18], [0.45, 0.21], [0.42, 0.23], [0.38, 0.22],
    [0.70, 0.48], [0.72, 0.46], [0.74, 0.49], [0.71, 0.51], [0.68, 0.50],
    [0.22, 0.66], [0.24, 0.64], [0.26, 0.67], [0.23, 0.69],
  ];
  dots.forEach(([fx, fy], i) => {
    const color = i < 5 ? '#6366f1' : i < 10 ? '#3b82f6' : '#7c3aed';
    dot(fx * W, fy * H, 1.5, color, 0.45);
  });

  function fluCard(x, y, w, h, color, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.fillStyle = color;
    ctx.globalAlpha = alpha * 0.06;
    roundRect(x, y, w, h, 14);
    ctx.fill();
    ctx.globalAlpha = alpha;
    roundRect(x, y, w, h, 14);
    ctx.stroke();
    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  fluCard(W * 0.76, H * 0.72, W * 0.18, H * 0.18, '#4f7ef7', 0.14);
  fluCard(W * 0.80, H * 0.77, W * 0.10, H * 0.09, '#7c3aed', 0.10);
  fluCard(W * 0.04, H * 0.06, W * 0.13, H * 0.13, '#4f7ef7', 0.10);

  const topGrad = ctx.createLinearGradient(0, 0, W, 0);
  topGrad.addColorStop(0,   'rgba(59,91,219,0.22)');
  topGrad.addColorStop(0.5, 'rgba(99,102,241,0.14)');
  topGrad.addColorStop(1,   'rgba(124,58,237,0.18)');
  ctx.fillStyle = topGrad;
  ctx.fillRect(0, 0, W, 1.5);

  const bottomBar = ctx.createLinearGradient(0, 0, 0, 32);
  bottomBar.addColorStop(0, 'rgba(255,255,255,0.03)');
  bottomBar.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = bottomBar;
  ctx.fillRect(0, H - 32, W, 32);
}

const ro = new ResizeObserver(resize);
ro.observe(wrap);
resize();
</script>
